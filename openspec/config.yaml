schema: spec-driven

# Project context — surfaced to AI as constraints for every change/artifact.
context: |
  Remendo — a keyboard-driven terminal app for reviewing Gerrit changes, where
  Claude Code adjudicates and applies reviewer comments. Rust + ratatui. Sibling
  project to vybim (a terminal editor); reuse from vybim is by COPY-AND-DIVERGE
  (diff_view.rs + `similar`, git.rs's spawn-wait-parse, lsp/transport.rs's
  worker-thread + channel pattern) — no shared crate yet.

  Development is SPEC-ANCHORED: every change has proposal/design/specs/tasks under
  openspec/, and implementation follows the spec. Do not implement ahead of spec.

  === Out-of-code facts (things the code cannot tell you) ===
  Recorded deliberately: a dry run found that adjudication quality is limited less
  by code reading than by context absent from the code, and that the resulting
  wrong answers read as confident. Add to this list whenever such a fact is
  settled.
  - TERMINAL, NOT A VSCODE EXTENSION. The UI model is borrowed from VSCode's
    inline merge-conflict resolution, and an extension would inherit the editor,
    tree and highlighting for free. We do not build one because NOT EVERYONE ON
    THE TEAM USES VSCODE; a terminal app is the one surface everyone has. This is
    a team fact, not a technical one — it will not be rediscoverable from the code.
  - READ-ONLY CODE PANE in v0. In-app editing is deferred, not forgotten: if a fix
    needs hand-writing, people fall back to the editor they already know. Revisit
    only if day-to-day use shows that fallback is real friction.
  - CLAUDE CLI IS PINNED at v2.1.220. The result-envelope shape,
    `structured_output`, `--tools`, inline `--json-schema` and
    resume-across-permission-modes are CLI surface, NOT a stable API. Re-probe on
    upgrade; do not assume from documentation or memory.
  - GERRIT AUTH IS `git credential fill` (settled 2026-08-05). Remendo stores no
    secret and parses no `.netrc`; it asks git, which already knows — inheriting
    keychains, credential helpers, gitcookies and corporate SSO along with it.
    Consequence: credentials live on the GIT trait, not the Gerrit trait.
  - CWD MUST BE INSIDE A CLONE of the change's project (settled 2026-08-05). A
    change id names no repository, so this one constraint supplies the clone, the
    Gerrit base URL (from `origin`, overridable) and the credential. Base-URL
    derivation is a default, not a guarantee — a Gerrit under a URL subpath is not
    recoverable from the remote, so failures must report the URL they derived.
  - THE TRIAGE UNIT IS A THREAD, NOT A COMMENT (settled 2026-08-05). Thread state
    is the LAST comment's `unresolved` flag; filtering per-comment re-opens
    settled threads. The whole exchange is what gets adjudicated, because an open
    thread's live request is frequently its last comment, not its first.
  - VERDICTS CARRY NO CONFIDENCE FIELD (settled 2026-08-05). The dry run measured
    9 of 12 context-dependent verdicts filed as confident, so the grade pointed
    away from what the human needs. `depends_on` is the signal instead — naming no
    fact versus three is checkable, a self-assessed grade is not.
  - `depends_on.verify` IS NEVER EXECUTED (settled 2026-08-05). It is prose for a
    human. The one measured "self-clearing" dependency was a probe invoking the
    `claude` CLI itself, so auto-running it would have had the verdict pass spawn
    billable subprocesses from a model-authored string.
  - UBUNTU 20.04 IS THE SUPPORT FLOOR (glibc 2.31), same as vybim. A team fact,
    not a technical one: teammates run 20.04, so a binary that only starts on
    24.04 is unusable team-wide. Three consequences, all cheap if honoured up
    front and expensive to retrofit:
      · TLS via rustls, never `native-tls`/`openssl` — 20.04 ships OpenSSL 1.1.1
        and 24.04 ships 3.0, so an OpenSSL-linked binary breaks across that line.
      · Release builds use `cargo zigbuild --target
        x86_64-unknown-linux-gnu.2.31` with an `objdump -T` guard failing the
        build on any newer GLIBC symbol. Lift both verbatim from vybim's
        `.github/workflows/release.yml` and its archived
        `linux-glibc-2-31-baseline` change; zig also compiles the tree-sitter C
        grammars against the 2.31 headers.
      · Remendo shells out to `claude` and `git`, so the floor is not only ours:
        both must run on 20.04 too (its git is 2.25.1). Unverified — see
        tasks.md 8.6.

  === Code style ===
  - Functions: 4–20 lines. Split if longer.
  - Files: under 500 lines **of code**, counted excluding the `#[cfg(test)]`
    module (settled 2026-08-05). Colocated tests are idiomatic and endorsed
    below, so counting them here would penalize coverage. Split by
    responsibility (SRP: one responsibility per module, one thing per function)
    — and note the SRP half is the real rule: `pane.rs` was split at ~580 lines
    because search is a separate responsibility, not because of the number.
  - Names: specific and unique. Avoid `data`, `handler`, `Manager`. Prefer names
    that return <5 grep hits in the codebase.
  - Types: explicit and precise. No stringly-typed domain values, no `Box<dyn
    Any>`; prefer newtypes/enums over bare `String`/`HashMap` for domain data.
    Every public function fully typed.
  - No code duplication. Extract shared logic into a function/module.
  - Early returns over nested ifs. Max 2 levels of indentation.
  - Error messages (thiserror/anyhow) MUST include the offending value and the
    expected shape.

  === Comments ===
  - Keep existing comments on refactor — they carry intent and provenance.
  - Write WHY, not WHAT. No `// increment counter` above `i += 1`.
  - Docstrings (`///`) on public items: intent + one usage example.
  - Reference issue numbers / commit SHAs when a line exists because of a specific
    bug or upstream constraint.

  === Tests ===
  - Single command: `cargo test`.
  - Every new function gets a test. Bug fixes get a regression test.
  - Mock external I/O (Gerrit REST, filesystem, git, the `claude` subprocess) with
    named fake types implementing the project's own trait — not inline closures or
    ad-hoc stubs. (Dovetails with wrapping third-party libs behind a trait.)
  - Tests are F.I.R.S.T: fast, independent, repeatable, self-validating, timely.

  === Dependencies ===
  - Inject dependencies through constructor/parameter (struct fields, fn args),
    not globals/statics/`lazy_static`.
  - Wrap third-party libs behind a thin, project-owned trait: the HTTP client
    behind a Gerrit trait, the git CLI behind a git trait, the `claude` CLI behind
    a driver trait, `similar` behind the diff module. Swapping the backend must be
    an implementation change behind the seam.

  === Structure ===
  - Follow Rust module conventions. Small focused modules over god files.
    Predictable paths (`src/<module>.rs`, tests alongside or under `tests/`).

  === Formatting ===
  - `cargo fmt` is the sole authority; CI enforces `cargo fmt --check` + `clippy`
    + `cargo test` (mirror vybim's gates). No style debate beyond the formatter.

  === Logging ===
  - Structured JSON for debugging / observability.
  - Plain text only for user-facing TUI / CLI output.

# Per-artifact rules — additional constraints applied when generating each artifact.
rules:
  tasks:
    - Each task names the module/trait it touches and stays testable in isolation.
  design:
    - State which third-party lib each new trait wraps, and the fake used to test it.
